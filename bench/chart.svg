<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-label="Benchmark: ssh-manager (Node MCP) against herdr-mcp (Rust)">
<style>
svg{--bg:#fcfcfb;--t1:#0b0b0b;--t2:#52514e;--mu:#898781;--grid:#e1e0d9;--s1:#2a78d6;--s2:#eb6834;--warn:#e5172a}
@media (prefers-color-scheme:dark){svg{--bg:#1a1a19;--t1:#f0efec;--t2:#c3c2b7;--mu:#898781;--grid:#2c2c2a;--s1:#3987e5;--s2:#d95926}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.bg{fill:var(--bg)}.t1{fill:var(--t1);font-size:13px;font-weight:600}.t2{fill:var(--t2);font-size:13px}.sm{font-size:12px}.mu{fill:var(--mu);font-size:11px}
.h{fill:var(--t1);font-size:18px;font-weight:600}.grid{stroke:var(--grid);stroke-width:1}.s1{fill:var(--s1)}.s2{fill:var(--s2)}.warn{fill:var(--warn)}.wt{fill:#fff;font-size:12px;font-weight:700;letter-spacing:2px}
</style>
<rect class="bg" width="720" height="560"/>
<text x="24" y="34" class="h">ssh-manager (Node MCP) against herdr-mcp (Rust)</text>
<text x="24" y="54" class="t2">Client: Windows 11 PC over a private mesh VPN. Hub host: Linux x86_64 running Herdr 0.9.5 and herdr-mcp (reached by ssh over stdio). Second host: Linux x86_64 reached from the hub through one ssh tunnel to its Herdr socket. Before = the Node MCP ssh-manager started on the client (direct ssh to each host). Latency = median of 20 consecutive `true` commands after a first warm-up call. Single run, one network. · 20 trials</text>
<rect x="24" y="66" width="10" height="10" rx="2" class="s1"/><text x="40" y="75" class="t2 sm">ssh-manager (Node MCP)</text>
<rect x="284" y="66" width="10" height="10" rx="2" class="s2"/><text x="300" y="75" class="t2 sm">herdr-mcp (Rust)</text>

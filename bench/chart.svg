><path d="M194,408H201.76a4,4 0 0 1 4,4V426a4,4 0 0 1 -4,4H194Z" class="s2"/><text x="213.76" y="423" class="t1">2.7 MB</text><line x1="24" x2="696" y1="434" y2="434" class="grid"/><text x="24" y="460" class="t2">Installed size</text><text x="186" y="485" text-anchor="end" class="t2 sm">ssh-manager (Node MCP)</text><path d="M194,470H582a4,4 0 0 1 4,4V488a4,4 0 0 1 -4,4H194Z" class="s1"/><text x="594" y="485" class="t1">33 MB</text><text x="186" y="511" text-anchor="end" class="t2 sm">herdr-mcp (Rust)</text><path d="M194,496H197.72121212121212a4,4 0 0 1 4,4V514a4,4 0 0 1 -4,4H194Z" class="s2"/><text x="209.72121212121212" y="511" class="t1">0.7 MB</text><line x1="24" x2="696" y1="522" y2="522" class="grid"/></svg>
